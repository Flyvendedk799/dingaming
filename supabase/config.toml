project_id = "dingaming"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323
api_url = "http://localhost"

[auth]
# A local stack otherwise runs on Supabase's public demo JWT secret, so anyone
# who can reach the API can mint a service_role token and bypass RLS entirely.
# Deployments must supply a real secret in the environment.
jwt_secret = "env(SUPABASE_AUTH_JWT_SECRET)"
enabled = true
site_url = "http://localhost:8080"
additional_redirect_urls = [
  "http://localhost:8080",
  "http://localhost:8080/reset-password",
  "http://127.0.0.1:8080",
]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
# Local dev: skip email confirmation so signups can log in immediately.
# Enable this (and configure SMTP) for production.
enable_confirmations = false

# --- Catalog sync (Kinguin -> local DB). Public so they can be scheduled. ---
[functions.kinguin-auto-sync]
verify_jwt = false

[functions.kinguin-backfill]
verify_jwt = false

[functions.kinguin-sync-products]
verify_jwt = false

[functions.kinguin-webhook]
verify_jwt = false

# --- Native checkout + Stripe-ready payment seam ---
