<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,300..800;1,62..125,400&family=Archivo+Narrow:wght@400..700&display=swap" rel="stylesheet">

    <title>WGaming | Køb spil — nøglen på e-mail inden for 60 sekunder</title>
    <meta name="description" content="Officielle digitale nøgler til Steam, PlayStation, Xbox og Nintendo. Priser inkl. moms, ingen gebyrer ved betaling, dansk support." />
    <meta name="author" content="WGaming" />
    <link rel="canonical" href="https://wgaming.dk/" />

    <!-- Icons. The SVG is the mark itself, so it stays sharp at any size and
         follows the browser's own light/dark chrome. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0B0A08" />

    <!-- iOS web app -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="WGaming" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />

    <meta property="og:site_name" content="WGaming" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="da_DK" />
    <meta property="og:url" content="https://wgaming.dk/" />
    <meta property="og:title" content="WGaming | Digitale spilnøgler" />
    <meta property="og:description" content="Officielle nøgler til Steam, PlayStation, Xbox og Nintendo. Nøgle på e-mail inden for 60 sekunder." />
    <meta property="og:image" content="https://wgaming.dk/og-image.png" />
    <meta property="og:image:alt" content="WGaming" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="WGaming | Digitale spilnøgler" />
    <meta name="twitter:description" content="Officielle nøgler til Steam, PlayStation, Xbox og Nintendo. Nøgle på e-mail inden for 60 sekunder." />
    <meta name="twitter:image" content="https://wgaming.dk/og-image.png" />

    <!-- Identity of the shop itself. Per-page structured data (Product,
         BreadcrumbList) is injected at runtime by src/lib/seo.ts. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "OnlineStore",
        "name": "WGaming",
        "url": "https://wgaming.dk/",
        "logo": "https://wgaming.dk/icon-512.png",
        "description": "Officielle digitale nøgler til Steam, PlayStation, Xbox og Nintendo.",
        "currenciesAccepted": "DKK",
        "areaServed": "DK",
        "potentialAction": {
          "@type": "SearchAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://wgaming.dk/search?q={search_term_string}"
          },
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
